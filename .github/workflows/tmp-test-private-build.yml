name: TEMP test private build workflow

# Throwaway: builds the root Dockerfile and pushes a dev tag, to check the
# build-arg plumbing and JFrog push. Delete once verified.
on:
  workflow_dispatch:
    inputs:
      build_base_image:
        description: 'Builder base image'
        required: false
        default: 'node:24-slim'
      runtime_base_image:
        description: 'Runtime base image'
        required: false
        default: 'node:24-slim'
  push:
    branches: [sd/hardened-images]
    paths:
      - '.github/workflows/tmp-test-private-build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and push dev image
    uses: truefoundry/github-workflows-public/.github/workflows/build.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      artifactory_registry_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_REGISTRY_URL }}
      artifactory_repository_url: ${{ vars.TRUEFOUNDRY_ARTIFACTORY_PUBLIC_REPOSITORY }}
      image_artifact_name: trueforge
      image_tag: dev-${{ github.sha }}
      image_context: .
      dockerfile_path: Dockerfile
      platforms: linux/amd64
      enable_jfrog: true
      enable_public_ecr: false
      image_build_args: |
        BUILD_BASE_IMAGE=${{ inputs.build_base_image || 'node:24-slim' }}
        RUNTIME_BASE_IMAGE=${{ inputs.runtime_base_image || 'node:24-slim' }}
    secrets:
      artifactory_username: ${{ secrets.TRUEFORGE_ARTIFACTORY_USERNAME }}
      artifactory_password: ${{ secrets.TRUEFORGE_ARTIFACTORY_PASSWORD }}
